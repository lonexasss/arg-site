<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIELD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ffffff;color:#666;font-family:monospace;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:420px;padding:20px}
h1{font-size:14px;font-weight:400;color:#888;margin-bottom:24px;letter-spacing:2px;text-transform:uppercase}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:#999;margin-bottom:4px;letter-spacing:1px}
.field input{width:100%;background:#fafafa;border:1px solid #ddd;color:#888;padding:8px 10px;font-family:monospace;font-size:13px;outline:none;transition:border-color .2s}
.field input:focus{border-color:#aaa;background:#f5f5f5}
.field input::placeholder{color:#ccc}
.btn{width:100%;margin-top:16px;padding:10px;background:#f2f2f2;border:1px solid #ddd;color:#888;font-family:monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .2s}
.btn:hover{background:#eaeaea}
.btn:disabled{opacity:.3;cursor:not-allowed}
.msg{margin-top:14px;font-size:11px;color:#aaa;min-height:16px;letter-spacing:1px}
.lockout{color:#999}
.timer{margin-top:6px;font-size:11px;color:#aaa}
.hint{font-size:10px;color:#bbb;margin-top:20px;letter-spacing:1px}
</style>
</head>
<body>
<div class="container">
  <h1>FIELD</h1>
  <form id="form" autocomplete="off">
    <div class="field"><label>Field 01</label><input type="text" id="f1" maxlength="64" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label>Field 02</label><input type="text" id="f2" maxlength="64" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label>Field 03</label><input type="text" id="f3" maxlength="64" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label>Field 04</label><input type="text" id="f4" maxlength="64" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label>Field 05</label><input type="text" id="f5" maxlength="64" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label>Field 06</label><input type="text" id="f6" maxlength="64" autocomplete="off" spellcheck="false"></div>
    <button class="btn" type="submit" id="submitBtn">Submit</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="hint">all fields are optional</div>
</div>

<script src="bundle.js"></script>
<script>
(function(){
  var MAX=5,WINDOW=60000,LOCK=300000;
  var form=document.getElementById('form'),msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');
  function get(){try{return JSON.parse(localStorage.getItem('_s')||'{}')}catch(e){return{}}}
  function set(s){localStorage.setItem('_s',JSON.stringify(s))}
  function isLock(){var s=get();if(s.until&&Date.now()<s.until)return Math.ceil((s.until-Date.now())/1000);return 0}
  function rec(){var s=get();if(!s.a)s.a=[];s.a.push(Date.now());s.a=s.a.filter(function(t){return Date.now()-t<WINDOW});if(s.a.length>=MAX){s.until=Date.now()+LOCK;s.a=[]}set(s)}
  function upd(){var rem=isLock();if(rem){btn.disabled=true;msg.className='msg lockout';msg.textContent='locked. wait '+rem+'s';requestAnimationFrame(function(){setTimeout(upd,500)})}else{btn.disabled=false;if(msg.className==='msg lockout'){msg.className='msg';msg.textContent=''}}}
  upd();
  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(isLock()){upd();return}
    rec();upd();
    if(typeof window.__check!=='function'){msg.textContent='init..';return}
    window.__check().then(function(res){
      if(res.why==='empty'){msg.className='msg';msg.textContent='fill at least one field';return}
      if(res.ok===true){
        msg.className='msg';msg.textContent=res.text;
        localStorage.removeItem('_s');
      }else{
        msg.className='msg';msg.textContent='not valid';
      }
    });
  });
})();
</script>
</body>
</html>
